<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fun Zone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      background: #faf7f5;
      font-family: Georgia, serif;
      color: #2b2b2b;
      position: relative; /* IMPORTANT */
    }

    /* Floral background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("images/floral-frame.png") center/cover no-repeat;
      opacity: 0.12;
      pointer-events: none;
      z-index: -1;
    }

    .container {
      max-width: 720px;
      margin: 120px auto;
      padding: 24px;
    }

    h1 {
      font-weight: normal;
      text-align: center;
      margin-bottom: 70px;
    }

    .joke-card {
      background: rgba(255, 255, 255, 0.92);
      padding: 30px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      backdrop-filter: blur(2px);
    }
