<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Happy Birthday Aishwarya 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #fffaf6;
      color: #444;
      overflow-x: hidden;
    }

    /* 🌸 HERO SECTION */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: relative;
      background: linear-gradient(135deg, #fffaf6, #ffeef3);
    }

    /* subtle floral corners */
    .flower {
      position: absolute;
      width: 180px;
      opacity: 0.08;
      pointer-events: none;
    }

    .flower.top-left {
      top: 0;
      left: 0;
    }

    .flower.bottom-right {
      bottom: 0;
      right: 0;
      transform: rotate(180deg);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      margin-bottom: 20px;
      color: #333;
    }

    .subtext {
      font-size: 1.2rem;
      max-width: 500px;
      line-height: 1.7;
      margin-bottom: 40px;
      color: #666;
    }

    .btn {
      padding: 14px 30px;
      background: #ffb6c1;
      border-radius: 30px;
      text-decoration: none;
      color: white;
      font-size: 1rem;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
      background: #ff9fb1;
    }

    /* 🌸 NEXT SECTION */
    .section {
      padding: 80px 20px;
      text-align: center;
    }

    .section h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    /* responsive */
    @media (max-width: 768px) {
      h1 {
        font-size: 2.2rem;
      }

      .subtext {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <!-- 🌸 HERO -->
  <section class="hero">

    <!-- light floral images -->
    <img src="https://pngimg.com/uploads/rose/rose_PNG669.png" class="flower top-left" />
    <img src="https://pngimg.com/uploads/rose/rose_PNG669.png" class="flower bottom-right" />

    <h1>Happy Birthday Aishwarya 💖</h1>

    <p class="subtext">
      I couldn’t buy something big enough for you… <br>
      so I made you a little world instead.
    </p>

    <a href="#next" class="btn">Open Your Surprise 💌</a>
  </section>


  <!-- 🌸 NEXT SECTION (placeholder for now) -->
  <section id="next" class="section">
    <h2>More memories coming soon ✨</h2>
    <p>This little space will keep growing… just like us.</p>
  </section>

</body>
</html>
